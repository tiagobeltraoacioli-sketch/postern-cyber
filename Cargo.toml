[workspace]
resolver = "2"
members = ["crates/proto", "crates/server", "crates/sensor"]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
